<style>
:root{

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI",Roboto,Arial,sans-serif}

button,.btn{font:inherit;height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s;white-space:nowrap}

button.danger{background:var(--err);border-color:var(--err)}button.danger:hover{background:#a03023}

button.sm{height:28px;padding:0 10px;font-size:12px}
input,select,textarea{font:inherit;color:var(--text);height:36px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:#fff;width:100%}
textarea{height:auto;min-height:80px;padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:-1px}
input[type=checkbox]{width:16px;height:16px}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.err-text{color:var(--err);font-size:12px}
.card{background:var(--card);border-radius:8px;box-shadow:var(--shadow);padding:20px 24px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.layout{display:flex;min-height:calc(100vh - 64px)}

main{flex:1;min-width:0;padding:24px;max-width:1440px;margin:0 auto;width:100%}
footer{border-top:1px solid var(--border);padding:16px 24px;color:var(--muted);font-size:12px;background:#fff}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}

table{border-collapse:separate;border-spacing:0;width:100%}

th{background:var(--head);font-weight:600;font-size:12px;color:var(--muted);position:sticky;top:0;z-index:2;white-space:nowrap}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}

.modal .row{justify-content:flex-end;margin-top:16px}

.toast{background:#fff;border-left:4px solid var(--primary);box-shadow:0 4px 12px rgba(16,24,40,.15);padding:12px 16px;border-radius:6px;min-width:260px;max-width:360px}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px}

/* автоопределение направления по ключевым словам (без учёта регистра и окончаний) */
function stem(w){w=w.toLowerCase().replace(/ё/g,'е');return w.length>5?w.slice(0,w.length-2):w.length>3?w.slice(0,w.length-1):w}
function detectCat(name){
  const words=(name||'').toLowerCase().split(/[^a-zа-яё0-9]+/i).filter(Boolean).map(stem);let best=null,score=0;
  DB.cats.filter(c=>c.active).forEach(c=>{let s=0;c.keywords.forEach(k=>{const kw=k.toLowerCase().split(/\s+/).map(stem);if(kw.every(x=>words.some(w=>w.startsWith(x)||x.startsWith(w)&&w.length>=4)))s+=kw.length});if(s>score){score=s;best=c.id}});
  return best;
}
/* проверка ИНН */
function innOk(v){if(!/^\d{10}$|^\d{12}$/.test(v))return false;const n=v.split('').map(Number);const c=(w)=>w.reduce((s,k,i)=>s+k*n[i],0)%11%10;
  if(v.length===10)return c([2,4,10,3,5,9,4,6,8])===n[9];
  return c([7,2,4,10,3,5,9,4,6,8])===n[10]&&c([3,7,2,4,10,3,5,9,4,6,8])===n[11]}

const vatK=v=>v==='none'||v==null?0:Number(v)/100;
function lineCalc(it,o){if(!o||o.ns||o.price==null||o.price==='')return null;const p=Number(o.price);const pv=Math.round(p*(1+vatK(o.vat))*100)/100;return{p,pv,sum:Math.round(pv*it.qty*100)/100,sumNo:Math.round(p*it.qty*100)/100}}
function offerTotals(r,offer,items){let no=0,w=0,cnt=0;(items||r.items).forEach(it=>{const c=lineCalc(it,offer.items[it.id]);if(c){no+=c.sumNo;w+=c.sum;cnt++}});return{no,vat:w-no,w,cnt}}
const submitted=r=>r.invitations.filter(i=>i.offer&&i.offer.status==='submitted');
const supItems=(r,sid)=>{const s=supplier(sid);return r.items.filter(it=>s&&s.cats.includes(it.cat))};

function nextNumber(){DB.seq++;return `КП-${new Date().getFullYear()}-${String(DB.seq).padStart(4,'0')}`}
function copyRequest(r){const c=JSON.parse(JSON.stringify(r));Object.assign(c,{id:'r'+uid(),number:nextNumber(),title:r.title+' (копия)',status:'draft',invitations:[],createdAt:now(),publishedAt:null,closedAt:null,deadline:now()+7*D,history:[],lastSeen:now(),createdBy:me().id});c.items.forEach(i=>i.id=uid());hist(c,'Черновик создан копированием заявки '+r.number);DB.requests.unshift(c);audit('Копирование заявки',r.number+' → '+c.number);save();toast('Создан черновик '+c.number,'ok');go('/requests/new?id='+c.id)}

    r.invitations.forEach(i=>{const u=DB.users.find(x=>x.supplierId===i.supplierId);u&&notify(u.id,`Заявка ${r.number} отменена`)});audit('Отмена заявки',r.number);save();close();toast('Заявка отменена; поставщики уведомлены');after()}})}

function cmpTable(r,prevSeen){
  const subs=submitted(r);const items=r.items.filter(i=>!card.cat||i.cat===card.cat);const withV=card.vat==='with';
  const cats=[...new Set(r.items.map(i=>i.cat))];

   <select id="vatSw" style="max-width:140px"><option value="with" ${withV?'selected':''}>С НДС</option><option value="without" ${withV?'':'selected'}>Без НДС</option></select><div class="sp"></div>
   <button class="sec" id="zip">⬇ Скачать все файлы КП</button><button id="xls">⬇ Выгрузить в Excel</button></div>`;
  if(!subs.length)return tools+'<div class="card empty">Предложений пока нет. Поставщики получили приглашения — здесь появится сравнительная таблица.</div>';
  const rows=items.map(it=>{const vals=subs.map(i=>{const c=lineCalc(it,i.offer.items[it.id]);return c?{v:withV?c.pv:c.p,s:withV?c.sum:c.sumNo}:null});
    const nums=vals.filter(Boolean).map(x=>x.v);const mn=Math.min(...nums),mx=Math.max(...nums);const avg=nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:null;
    const sd=nums.length>1?Math.sqrt(nums.reduce((a,b)=>a+(b-avg)**2,0)/(nums.length-1)):0;const cv=avg?sd/avg*100:null;return{it,vals,nums,mn,mx,avg,cv}});
  const totals=subs.map((i,k)=>{let s=0,c=0;rows.forEach(x=>{if(x.vals[k]){s+=x.vals[k].s;c++}});return{s,c}});
  return tools+`<div class="small muted" style="margin-bottom:8px">▼ — минимальная цена в строке, ▲ — максимальная. Цена за единицу ${withV?'с НДС':'без НДС'}, ниже — сумма по позиции.</div>
  <div class="tw"><table><thead><tr><th class="stick1 num" style="width:44px">№</th><th class="stick2" style="min-width:220px">Наименование</th><th class="num">Кол-во</th>

  <th class="num">Мин.</th><th class="num">Средняя</th><th class="num">Макс.</th><th class="num">КП</th><th class="num">Вариация</th></tr></thead><tbody>
  ${rows.map(x=>`<tr><td class="stick1 num">${x.it.line}</td><td class="stick2">${esc(x.it.name)}<div class="small muted">${esc(x.it.unit)}</div></td><td class="num">${qtyf(x.it.qty)}</td>
   ${x.vals.map(v=>{if(!v)return'<td class="num muted">—</td>';const isMin=x.nums.length>1&&v.v===x.mn,isMax=x.nums.length>1&&v.v===x.mx&&x.mn!==x.mx;return `<td class="num ${isMin?'min':isMax?'max':''}">${isMin?'▼ ':isMax?'▲ ':''}${money(v.v,false)}<div class="small">${money(v.s,false)}</div></td>`}).join('')}
   <td class="num">${x.nums.length?money(x.mn,false):'—'}</td><td class="num">${x.avg!=null?money(x.avg,false):'—'}</td><td class="num">${x.nums.length?money(x.mx,false):'—'}</td><td class="num">${x.nums.length}</td>
   <td class="num">${x.cv!=null&&x.nums.length>1?(x.cv>33?'<span title="Значительный разброс цен" style="color:var(--warn)">⚠ </span>':'')+x.cv.toFixed(1)+' %':'—'}</td></tr>`).join('')}</tbody>
  <tfoot><tr><td class="stick1"></td><td class="stick2">Итого по КП</td><td></td>${totals.map(t=>`<td class="num">${money(t.s)}<div class="small" style="font-weight:400">${t.c} из ${items.length} поз.</div></td>`).join('')}<td colspan="5"></td></tr></tfoot></table></div>`;
}

function reqAction(r,a,after){

      <label class="f" style="margin-top:12px"><span>Или пригласить по e-mail</span><input id="ie" type="email" placeholder="email@company.ru"></label><select id="ic">${cats.map(c=>`<option value="${c}">${esc(cat(c).name)}</option>`).join('')}</select>
      <div class="row"><button class="sec" data-close>Отмена</button><button id="ok">Пригласить</button></div>`,(m,close)=>{$('#ok',m).onclick=()=>{

function exportXlsx(r){
  const subs=submitted(r);const cmp=[['№','Наименование','Ед. изм.','Кол-во',...subs.map(i=>supplier(i.supplierId).shortName+' (цена с НДС)'),'Мин.','Средняя','Макс.','Кол-во КП','Вариация, %']];
  r.items.forEach(it=>{const v=subs.map(i=>lineCalc(it,i.offer.items[it.id])?.pv??null);const n=v.filter(x=>x!=null);const avg=n.length?n.reduce((a,b)=>a+b,0)/n.length:null;const sd=n.length>1?Math.sqrt(n.reduce((a,b)=>a+(b-avg)**2,0)/(n.length-1)):0;
    cmp.push([it.line,it.name,it.unit,it.qty,...v.map(x=>x??'—'),n.length?Math.min(...n):'—',avg??'—',n.length?Math.max(...n):'—',n.length,avg&&n.length>1?+(sd/avg*100).toFixed(1):'—'])});
  cmp.push(['','Итого','','',...subs.map(i=>offerTotals(r,i.offer).w)]);

  r.invitations.forEach(i=>{const s=supplier(i.supplierId)||{};const o=i.offer&&i.offer.status==='submitted'?i.offer:null;sup.push([s.shortName||i.email,s.inn||'',s.kpp||'',s.ogrn||'',s.contact||'',s.phone||'',i.email,INV[i.status][0],o?fdt(o.submittedAt):'',o?offerTotals(r,o).w:'',o?o.deliveryDays:'',o?o.payment:'',o?fd(o.validUntil):'',o?o.warranty:'',o?(o.deliveryIncl?'Да':'Нет'):''])});
  const pos=[['№','Наименование','Характеристики','Ед. изм.','Количество','Направление'],...r.items.map(i=>[i.line,i.name,i.specs,i.unit,i.qty,cat(i.cat)?.name||''])];
  if(window.XLSX){const wb=XLSX.utils.book_new();[['Сравнение',cmp],['Поставщики',sup],['Позиции',pos]].forEach(([n,d])=>{const ws=XLSX.utils.aoa_to_sheet(d);ws['!cols']=d[0].map((_,k)=>({wch:k===1?40:18}));XLSX.utils.book_append_sheet(wb,ws,n)});XLSX.writeFile(wb,`${r.number}_сравнение.xlsx`)}
  else download(`${r.number}_сравнение.csv`,'﻿'+cmp.map(x=>x.join(';')).join('\n'),'text/csv');
  toast('Файл выгружен','ok');
}

  download(`${r.number}_файлы_КП.txt`,'Состав архива (демо):\n'+subs.map(i=>{const s=supplier(i.supplierId);return `${s.shortName}/\n  ${i.offer.file}\n${(i.offer.extra||[]).map(f=>'  '+f+'\n').join('')}`}).join(''));toast('В рабочей версии здесь скачивается ZIP-архив; в демо — его опись')}

function parseFile(f){const out=$('#perr');if(f.size>10*1024*1024){out.innerHTML='<div class="alert a-err">Файл больше 10 МБ</div>';return}
  if(!/\.(xlsx|xls|csv)$/i.test(f.name)){out.innerHTML='<div class="alert a-err">Поддерживаются только .xlsx, .xls, .csv</div>';return}
  const rd=new FileReader();rd.onload=()=>{let rows;try{if(window.XLSX){const wb=XLSX.read(rd.result,{type:'array',codepage:65001});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}else{const t=new TextDecoder().decode(rd.result);rows=t.split(/\r?\n/).map(l=>l.split(/[;\t,]/))}}catch(e){out.innerHTML='<div class="alert a-err">Не удалось прочитать файл</div>';return}
    const hi=rows.findIndex(r=>r.some(c=>SYN.name.includes(String(c).trim().toLowerCase().replace(/\*$/,''))));
    const head=(rows[hi]||[]).map(c=>String(c).trim().toLowerCase().replace(/\*$/,'').trim());const col={};Object.entries(SYN).forEach(([k,s])=>{const i=head.findIndex(h=>s.includes(h));if(i>=0)col[k]=i});

}

  parseHash();tick();const p=route.path;window.scrollTo(0,0);
  if(p==='/register')return pageRegister();if(p==='/reset-password')return pageReset();
  const u=me();if(!u||u.status!=='active'){DB.session=null;return pageLogin()}
  if(p==='/login'){go(u.role==='admin'?'/admin/users':'/');return}
  if(p==='/profile')return pageProfile();
  if(u.role==='supplier'){const m=p.match(/^\/invitations\/(.+)$/);if(m)return pageInvitation(m[1]);return pageSupHome()}
  if(p.startsWith('/admin/')){if(u.role!=='admin'){go('/');return}return pageAdmin(p.split('/')[2]||'users')}
  if(p==='/requests/new')return pageWizard();
  const m=p.match(/^\/requests\/(.+)$/);if(m){if(window._lastReq!==m[1]){card.tab='cmp';card.cat='';window._lastReq=m[1]}return pageRequest(m[1])}
  if(p==='/suppliers')return pageSuppliers();if(p==='/suppliers/moderation')return pageModeration();
  if(p!=='/'){go('/');return}
  wiz=null;pageDashboard();
}
load();save();window.addEventListener('hashchange',render);render();
setInterval(()=>{const before=JSON.stringify(DB.requests.map(r=>r.status));tick();if(JSON.stringify(DB.requests.map(r=>r.status))!==before)render()},60000);
</script>
